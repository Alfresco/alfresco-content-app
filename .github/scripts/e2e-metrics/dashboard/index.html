<!doctype html>
<!--
  ACA E2E test health: flaky and slow Playwright tests, built by .github/scripts/e2e-metrics/build-dashboard.js.
  Data is loaded from data/history.js (window.E2E_HISTORY). The view state is kept in the URL hash so links can be shared.
-->
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACA E2E test health</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #ffffff;
        --sunken: #f3f4f6;
        --band: #eceef2;
        --ink: #1c1e21;
        --secondary: #5c6370;
        --rule: #dcdfe4;
        --link: #1f5fbf;
        --retried: #b26b00;
        --failed: #c42b1c;
        --duration: #5b7fb8;
        --fresh: #1f6f43;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #18191b;
          --sunken: #222326;
          --band: #26282c;
          --ink: #e8e9eb;
          --secondary: #a0a6b0;
          --rule: #34373c;
          --link: #7fb0ff;
          --retried: #e0a43a;
          --failed: #ff7a6e;
          --duration: #8fb0e6;
          --fresh: #6fcf97;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      a { color: var(--link); }
      :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
      .page { max-width: 1320px; margin: 0 auto; padding: 24px 24px 48px; }
      h1 { font-size: 20px; font-weight: 600; margin: 0; }
      h2 { font-size: 15px; font-weight: 600; margin: 0; }
      .secondary { color: var(--secondary); }
      .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

      .masthead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 24px; }
      .masthead p { margin: 4px 0 0; max-width: 72ch; }
      .updated { color: var(--secondary); }
      .updated time { color: var(--fresh); font-weight: 600; }
      .updated.is-stale time { color: var(--retried); }

      .filters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin: 20px 0; }
      .filters label, .filters .field { display: grid; gap: 4px; font-size: 13px; color: var(--secondary); }
      input, select, button { font: inherit; color: var(--ink); background: var(--page); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 8px; }
      input[type='search'] { width: 280px; max-width: 100%; }
      select#suite { max-width: 240px; }
      button { cursor: pointer; }
      .link-button { border: 0; padding: 6px 0; background: none; color: var(--link); text-decoration: underline; }

      .date-field { position: relative; }
      .date-button { min-width: 140px; text-align: left; }
      .calendar { position: absolute; top: 100%; left: 0; z-index: 10; width: 272px; margin-top: 4px; padding: 12px; background: var(--page); border: 1px solid var(--rule); border-radius: 6px; box-shadow: 0 6px 20px rgb(0 0 0 / 18%); color: var(--ink); }
      .calendar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .calendar-head button { border: 0; background: none; font-size: 18px; line-height: 1; padding: 4px 8px; }
      .calendar-head button:disabled { color: var(--rule); cursor: default; }
      .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
      .calendar-grid .weekday { font-size: 12px; color: var(--secondary); padding: 2px 0 6px; }
      .calendar-grid .day { position: relative; border: 0; background: none; padding: 6px 0; border-radius: 4px; font-variant-numeric: tabular-nums; }
      .calendar-grid .day:hover:not(:disabled) { background: var(--sunken); }
      .calendar-grid .day.has-data::after { content: ''; position: absolute; left: 50%; bottom: 2px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--duration); }
      .calendar-grid .day[aria-pressed='true'] { background: var(--ink); color: var(--page); }
      .calendar-grid .day[aria-pressed='true']::after { background: var(--page); }
      .calendar-grid .day:disabled { color: var(--rule); cursor: default; }
      .calendar-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; color: var(--secondary); }

      /* Each stat has a left rule; the negative margin and overflow hide the rule at the start of every row. */
      .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); overflow: hidden; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
      .stat { padding: 12px 16px; margin-left: -1px; border-left: 1px solid var(--rule); }
      .stat .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .stat .value small { font-size: 14px; font-weight: 400; color: var(--secondary); }
      .stat .label { font-size: 13px; color: var(--secondary); }
      .stat.is-retried .value { color: var(--retried); }
      .stat.is-failed .value { color: var(--failed); }
      .stat.is-slow .value { color: var(--duration); }
      button.stat { display: block; width: auto; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-left: 1px solid var(--rule); border-radius: 0; cursor: pointer; }
      button.stat:hover { background: var(--sunken); }
      button.stat .label { text-decoration: underline; }
      .days-note { margin: 8px 0 0; font-size: 13px; color: var(--secondary); }

      /* Tabs sit on a tinted band; the selected tab opens into the panel below. Accents follow the data colours. */
      .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 32px; padding: 6px 6px 0; background: var(--band); border: 1px solid var(--rule); border-bottom: 0; border-radius: 6px 6px 0 0; }
      .tabs button { --accent: var(--secondary); border: 0; border-top: 3px solid var(--accent); border-radius: 4px 4px 0 0; background: none; padding: 8px 16px; color: var(--secondary); }
      .tabs button:hover { color: var(--ink); background: var(--page); }
      .tabs button[aria-selected='true'] { color: var(--ink); background: var(--page); font-weight: 600; }
      .tabs button[data-tab='flaky'] { --accent: var(--retried); }
      .tabs button[data-tab='slowest'] { --accent: var(--duration); }
      .tabs button[data-tab='failed'] { --accent: var(--failed); }
      .tab-panel { border: 1px solid var(--rule); border-top: 0; border-radius: 0 0 6px 6px; padding: 0 16px 16px; }

      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
      th { font-size: 13px; font-weight: 600; color: var(--secondary); white-space: nowrap; }
      th[data-sort] { cursor: pointer; }
      th[aria-sort='descending']::after { content: ' ▾'; }
      th[aria-sort='ascending']::after { content: ' ▴'; }
      td.rank { width: 1%; color: var(--secondary); }
      .test { min-width: 320px; max-width: 640px; }
      .test-title { font-weight: 500; }
      .test-meta { font-size: 13px; color: var(--secondary); }
      .test-meta a { text-decoration: none; }
      .test-meta a:hover { text-decoration: underline; }
      tr.test-row { cursor: pointer; }
      tr.test-row:hover, tr.test-row[aria-expanded='true'] { background: var(--sunken); }
      tr.group-row { cursor: pointer; }
      tr.group-row:hover { background: var(--sunken); }
      tr.group-suite { background: var(--band); }
      tr.group-suite .group-name { font-weight: 600; }
      .group-name { font-weight: 500; }
      .group-kind { font-size: 11px; font-weight: 400; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.04em; }
      .chevron { display: inline-block; width: 1em; color: var(--secondary); }
      .tree-tools { display: flex; gap: 16px; padding-top: 8px; }
      .count-of { color: var(--secondary); }
      td.primary { font-size: 17px; font-weight: 600; }
      td.primary .count-of { font-size: 13px; font-weight: 400; }
      .is-retried { color: var(--retried); }
      .is-failed { color: var(--failed); }

      .measure { display: grid; grid-template-columns: auto 80px; align-items: center; gap: 8px; justify-content: end; }
      .measure .track { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
      .measure .fill { height: 100%; background: var(--retried); }

      tr.detail > td { background: var(--sunken); padding: 12px 16px; }
      tr.detail table { width: auto; }
      tr.detail th, tr.detail td { padding: 5px 20px 5px 0; border-bottom: 1px solid var(--rule); }
      tr.detail tbody tr:last-child td { border-bottom: 0; }
      .detail-summary { margin: 4px 0 10px; }
      .detail-note { margin: 10px 0 0; font-size: 13px; color: var(--secondary); }
      .attempts { max-width: 420px; }
      .attempt-failed { color: var(--failed); }
      .slower { color: var(--retried); font-weight: 600; }

      .empty { padding: 32px 0; color: var(--secondary); }
      .more { padding: 16px 0 0; }
      .legend { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--rule); max-width: 90ch; }
      .legend summary { cursor: pointer; font-weight: 600; }
      .legend p { margin: 8px 0 12px; color: var(--secondary); }
      .legend dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
      .legend dt { font-weight: 600; }
      .legend dd { margin: 0; color: var(--secondary); }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div>
          <h1>ACA E2E test health</h1>
          <p class="secondary" id="intro"></p>
        </div>
        <p class="updated" id="updated"></p>
      </header>

      <form class="filters" id="filters" onsubmit="return false">
        <label>Period
          <select id="days"></select>
        </label>
        <div class="field date-field" id="date-field">
          <span id="end-label">Up to</span>
          <button type="button" class="date-button" id="end" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="end-label end"></button>
          <div class="calendar" id="calendar" role="dialog" aria-label="Choose the last day of the period" hidden></div>
        </div>
        <label>Search <input type="search" id="q" placeholder="Test title, file or XAT id" /></label>
        <label>Suite <select id="suite"></select></label>
        <button class="link-button" id="reset" type="button">Clear filters</button>
      </form>

      <main>
        <section class="summary" id="summary" aria-label="Summary"></section>
        <p class="days-note" id="days-note" hidden></p>

        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div class="tab-panel" id="panel" role="tabpanel"></div>
      </main>
    </div>

    <script src="data/history.js"></script>
    <script>
      (function () {
        'use strict';

        const TOP_LIMIT = 10;
        const RUN_LIMIT = 20;
        // Runs this much slower than the test's average are highlighted in the per-run view.
        const SLOW_RUN_RATIO = 0.2;
        const WORKFLOW_NAMES = { 'cron-e2e-chrome.yml': 'Daily chrome run', 'populate-e2e-reports.yml': 'Populate run' };
        const OUTCOME_LABELS = { p: ['Passed', 'secondary'], r: ['Passed on retry', 'is-retried'], f: ['Failed', 'is-failed'] };
        const ATTEMPT_LABELS = { p: 'passed', f: 'failed', t: 'timed out', i: 'interrupted' };
        // Workflow run conclusions listed under Failed workflows; the order ranks results when sorting by Result.
        const FAILED_CONCLUSIONS = new Set(['failure', 'timed_out']);
        const CONCLUSION_ORDER = ['success', 'neutral', 'skipped', 'cancelled', null, 'timed_out', 'failure'];
        const TITLE_SEPARATOR = ' › ';
        const GROUP_INDENT_PX = 20;
        const GROUP_KINDS = { suite: 'Suite', file: 'File', describe: 'Describe' };
        const STALE_AFTER_HOURS = 36;
        const DAY_MS = 24 * 60 * 60 * 1000;
        const WEEKDAYS = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
        const metrics = window.E2E_HISTORY;
        const $ = (id) => document.getElementById(id);
        const numberFormat = new Intl.NumberFormat('en-GB');

        if (!metrics || !metrics.days) {
          document.querySelector('main').innerHTML = '<p class="empty">The data file (data/history.js) could not be loaded. Check the last run of the E2E metrics report workflow.</p>';
          return;
        }

        const DEFAULTS = { tab: 'flaky', days: '14', end: '', q: '', suite: '', sort: '', dir: '' };
        const TAB_SORT = { flaky: ['retries', 'desc'], slowest: ['avg', 'desc'], all: ['title', 'asc'], runs: ['date', 'desc'], failed: ['date', 'desc'] };
        const lastDate = metrics.days.length ? metrics.days[metrics.days.length - 1].date : new Date().toISOString().slice(0, 10);
        const firstDate = metrics.days.length ? metrics.days[0].date : lastDate;
        // Periods that fit in the kept history (14 days by default).
        const PERIODS = [7, 14, 30, 90].filter((days) => days <= (metrics.historyDays || 14));
        $('days').innerHTML = PERIODS.map((days) => '<option value="' + days + '">Last ' + days + ' days</option>').join('');
        const datesWithData = new Set(metrics.days.map((day) => day.date));

        // What each column means; shown as the column tooltip and in the legend below each list.
        const COLUMN_HELP = {
          title: 'Describe blocks and title of the test, with its suite and file. Click a row to see every run of the test: its result, retries, each attempt and how long it took.',
          retries: 'How many times Playwright retried the test. On CI a failed test is retried up to 2 times, so one run can add 2 retries and the total can be higher than the number of runs.',
          rate: 'Runs that needed at least one retry, whether the test passed in the end or not, and their share of all runs. A run counts once however many retries it needed: 17 retried runs out of 31, 10 of them retried twice and 7 once, give 27 retries and 55%.',
          failures: 'Runs where the test still failed after all retries.',
          avg: 'Average time of the passed attempts: beforeAll and beforeEach hooks (setup), the test itself and its afterEach hooks. afterAll hooks are not counted. Failed attempts are left out so timeouts do not distort the average.',
          setup: 'Part of the average duration spent in beforeAll and beforeEach hooks. Playwright runs a beforeAll hook once per worker, but every test that depends on it is charged its full time, so the sum of all durations is higher than the real run time.',
          max: 'The longest passed attempt in the selected period, including setup.',
          runs: 'Executions of the test in workflow runs. When a whole suite is re-run, each attempt counts as a run.'
        };
        const TAB_INTRO = {
          flaky: 'Tests that needed at least one retry or failed in the selected period, ordered by retries.',
          slowest: 'Tests that passed at least once in the selected period, ordered by average duration.',
          all: 'Every test that ran in the selected period, grouped by suite, test file and describe block. Group rows show the totals of their tests; click a group to expand or collapse it.',
          runs: 'Workflow runs whose test results are included: the daily chrome run and Populate E2E reports runs on ' + (metrics.branch || 'develop') + '.',
          failed: 'Workflow runs that failed or timed out. A failed run still provides results for the tests that ran.'
        };
        const RUNS_HELP = {
          date: 'Day the workflow run started (UTC).',
          workflow: 'Workflow file that produced the results.',
          run: 'Link to the workflow run on GitHub, with its logs and artifacts.',
          result: 'Outcome of the whole workflow run. A failed run still provides results for the tests that ran. Sorting puts failed runs first, then timed out, in progress, cancelled and successful runs.'
        };

        let state = readState();
        let showAll = false;
        // The legend is collapsed by default and stays as the user left it when the list re-renders.
        let legendOpen = false;
        let calendarMonth = lastDate.slice(0, 7);
        const expanded = new Set();
        // Groups of the All tests tree the user opened (true) or closed (false); others use the default.
        const groupToggles = new Map();
        let visibleGroupKeys = [];
        // Tests whose per-run view shows all runs instead of the latest RUN_LIMIT.
        const allRunsShown = new Set();

        function esc(value) {
          return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        }

        function shiftDate(date, days) {
          return new Date(Date.parse(date + 'T00:00:00Z') + days * DAY_MS).toISOString().slice(0, 10);
        }

        function formatDate(date, options = {}) {
          return new Date(date + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC', ...options });
        }

        function formatDuration(ms) {
          const totalSeconds = Math.round(ms / 100) / 10;
          if (totalSeconds < 60) return totalSeconds.toFixed(1) + 's';
          // Round to whole seconds before splitting, so 119.6s becomes 2m 00s and not 1m 60s.
          const wholeSeconds = Math.round(ms / 1000);
          return Math.floor(wholeSeconds / 60) + 'm ' + String(wholeSeconds % 60).padStart(2, '0') + 's';
        }

        function percent(value) {
          return (value * 100).toFixed(value > 0 && value < 0.1 ? 1 : 0) + '%';
        }

        function plural(count, word) {
          return numberFormat.format(count) + ' ' + word + (count === 1 ? '' : 's');
        }

        function readState() {
          const params = new URLSearchParams(location.hash.slice(1));
          const result = { ...DEFAULTS };
          for (const key of Object.keys(DEFAULTS)) {
            if (params.has(key)) result[key] = params.get(key);
          }
          return result;
        }

        function writeState() {
          const params = new URLSearchParams();
          for (const [key, value] of Object.entries(state)) {
            if (value && value !== DEFAULTS[key]) params.set(key, value);
          }
          window.history.replaceState(null, '', '#' + params.toString());
        }

        function setState(patch) {
          state = { ...state, ...patch };
          showAll = false;
          writeState();
          render();
        }

        function periodDays() {
          const days = Number(state.days);
          return PERIODS.includes(days) ? days : PERIODS[PERIODS.length - 1];
        }

        function rangeDates() {
          const end = state.end || lastDate;
          const days = periodDays();
          return Array.from({ length: days }, (_, i) => shiftDate(end, i - days + 1));
        }

        function aggregate(dates) {
          const inRange = new Set(dates);
          const days = metrics.days.filter((day) => inRange.has(day.date));
          const tests = new Map();
          for (const day of days) {
            for (const [index, runs, retries, flakyRuns, failures, durationSum, durationCount, durationMax, setupSum = 0] of day.tests) {
              let test = tests.get(index);
              if (!test) {
                const [suite, file, title, path, line] = metrics.tests[index];
                test = { index, suite, file, title, path, line, runs: 0, retries: 0, flakyRuns: 0, failures: 0, durationSum: 0, durationCount: 0, setupSum: 0, max: 0, runResults: [], daysWithoutDetail: 0 };
                tests.set(index, test);
              }
              test.runs += runs;
              test.retries += retries;
              test.flakyRuns += flakyRuns;
              test.failures += failures;
              test.durationSum += durationSum;
              test.durationCount += durationCount;
              test.setupSum += setupSum;
              test.max = Math.max(test.max, durationMax);
              if (!day.results) test.daysWithoutDetail += 1;
            }
            for (const [index, runIndex, suiteAttempt, outcome, retries, duration, setup, attempts] of day.results || []) {
              tests.get(index)?.runResults.push({ date: day.date, run: day.runs[runIndex], suiteAttempt, outcome, retries, duration, setup, attempts });
            }
          }
          for (const test of tests.values()) {
            test.avg = test.durationCount ? test.durationSum / test.durationCount : 0;
            test.setup = test.durationCount ? test.setupSum / test.durationCount : 0;
            // Runs that needed at least one retry: flaky (passed on a retry) or failed after all retries.
            test.retried = test.flakyRuns + test.failures;
            test.rate = test.runs ? test.retried / test.runs : 0;
          }
          return { days, tests: [...tests.values()] };
        }

        function sourceLink(test) {
          const label = esc(test.file) + (test.line ? ':' + test.line : '');
          if (!test.path || !metrics.repository) return label;
          const url = metrics.serverUrl + '/' + metrics.repository + '/blob/' + (metrics.branch || 'develop') + '/' + test.path + (test.line ? '#L' + test.line : '');
          return '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + label + '</a>';
        }

        function measure(value, max, text) {
          const width = max > 0 ? Math.max((value / max) * 100, value > 0 ? 2 : 0) : 0;
          return '<div class="measure"><span>' + text + '</span><div class="track"><div class="fill" style="width:' + width.toFixed(1) + '%"></div></div></div>';
        }

        function renderMasthead() {
          const repo = metrics.repository
            ? ' <a href="' + esc(metrics.serverUrl + '/' + metrics.repository + '/actions') + '" target="_blank" rel="noopener">Workflow runs on GitHub</a>'
            : '';
          $('intro').innerHTML = 'Flaky and slow Playwright tests from E2E runs on the ' + esc(metrics.branch || 'develop') + ' branch.' + repo;
          const generated = new Date(metrics.generatedAt);
          const stale = Date.now() - generated.getTime() > STALE_AFTER_HOURS * 60 * 60 * 1000;
          const updated = generated.toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
          $('updated').classList.toggle('is-stale', stale);
          $('updated').innerHTML =
            'Updated <time datetime="' + esc(metrics.generatedAt) + '"' + (stale ? ' title="Not updated in the last day. Check the E2E metrics report workflow."' : '') + '>' + esc(updated) + '</time>' +
            '<br />' + plural(metrics.days.length, 'day') + ' of history';
        }

        function renderFilters(suites) {
          $('days').value = String(periodDays());
          $('end').textContent = formatDate(state.end || lastDate, { year: 'numeric' });
          if ($('q').value !== state.q) $('q').value = state.q;
          $('suite').innerHTML = '<option value="">All suites</option>' + suites.map((s) => '<option' + (s === state.suite ? ' selected' : '') + '>' + esc(s) + '</option>').join('');
        }

        function renderSummary(data, dates) {
          const runs = data.days.flatMap((day) => day.runs);
          const failedRuns = runs.filter(isFailedRun).length;
          const flaky = data.tests.filter(tabFilter('flaky')).length;
          const slowest = data.tests.filter(tabFilter('slowest')).reduce((top, t) => (!top || t.avg > top.avg ? t : top), null);
          const stats = [
            { tab: 'flaky', label: 'Flaky tests', value: numberFormat.format(flaky) + ' <small>of ' + numberFormat.format(data.tests.length) + '</small>', cls: flaky ? 'is-retried' : '' },
            {
              tab: 'slowest',
              label: 'Slowest test',
              value: slowest ? formatDuration(slowest.avg) + ' <small>on average</small>' : 'none',
              cls: slowest ? 'is-slow' : '',
              title: slowest ? slowest.title + ' (' + slowest.suite + '). Show the slowest tests' : 'Show the slowest tests'
            },
            { tab: 'runs', label: 'Workflow runs', value: numberFormat.format(runs.length) },
            { tab: 'failed', label: 'Failed workflows', value: numberFormat.format(failedRuns), cls: failedRuns ? 'is-failed' : '' }
          ];
          $('summary').innerHTML = stats
            .map(({ tab, label, value, cls = '', title }) =>
              '<button type="button" class="stat ' + cls + '" data-tab="' + tab + '" title="' + esc(title || 'Show the ' + label.toLowerCase()) + '">' +
              '<div class="value">' + value + '</div><div class="label">' + esc(label) + '</div></button>')
            .join('');
          const missing = dates.length - data.days.length;
          $('days-note').hidden = missing === 0;
          $('days-note').textContent = 'No data was collected for ' + missing + ' of the ' + plural(dates.length, 'day') + ' in this period.';
        }

        function renderTabs(counts) {
          const tabs = [
            ['flaky', '🔁 Flaky tests', counts.flaky],
            ['slowest', '🐢 Slowest tests', null],
            ['failed', 'Failed workflows', counts.failed],
            ['runs', 'Workflow runs', counts.runs],
            ['all', 'All tests', counts.all]
          ];
          $('tabs').innerHTML = tabs
            .map(([id, label, count]) => '<button type="button" role="tab" data-tab="' + id + '" aria-selected="' + (state.tab === id) + '">' + label + (count == null ? '' : ' <span class="secondary">' + numberFormat.format(count) + '</span>') + '</button>')
            .join('');
        }

        function matchesFilters(t) {
          const q = state.q.trim().toLowerCase();
          if (state.suite && t.suite !== state.suite) return false;
          return !q || (t.title + ' ' + t.suite + ' ' + t.file).toLowerCase().includes(q);
        }

        function tabFilter(tab) {
          if (tab === 'flaky') return (t) => t.retries > 0 || t.failures > 0;
          if (tab === 'slowest') return (t) => t.durationCount > 0;
          return () => true;
        }

        function isFailedRun(run) {
          return FAILED_CONCLUSIONS.has(run.conclusion);
        }

        function runTime(run) {
          return String(run.createdAt || run.date);
        }

        // Equal tests: the one that failed more often first, so tests that never passed rank above flaky ones.
        const testTieBreak = (a, b) => b.failures - a.failures || String(a.title).localeCompare(String(b.title));
        const runTieBreak = (a, b) => runTime(b).localeCompare(runTime(a));

        function sortRows(rows, columns, tieBreak = testTieBreak) {
          const [defaultKey, defaultDir] = TAB_SORT[state.tab];
          const key = columns.some((c) => c.key === state.sort) ? state.sort : defaultKey;
          const dir = state.sort === key && state.dir ? state.dir : defaultDir;
          const column = columns.find((c) => c.key === key);
          const value = column.sortValue || ((row) => row[key]);
          const sign = dir === 'asc' ? 1 : -1;
          rows.sort((a, b) => {
            const va = value(a), vb = value(b);
            const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
            return cmp * sign || tieBreak(a, b);
          });
          return { key, dir };
        }

        function testColumns(rows) {
          const maxRate = Math.max(0, ...rows.map((t) => t.rate));
          const test = {
            key: 'title',
            label: 'Test',
            cls: 'test',
            sortValue: (t) => t.suite + ' ' + t.title,
            render: (t) => '<div class="test-title">' + esc(t.title) + '</div><div class="test-meta">' + esc(t.suite) + ', ' + sourceLink(t) + '</div>'
          };
          const retries = {
            key: 'retries',
            label: 'Retries',
            num: true,
            render: (t) => '<span class="' + (t.retries ? 'is-retried' : '') + '">' + numberFormat.format(t.retries) + '</span> <span class="count-of">in ' + plural(t.runs, 'run') + '</span>'
          };
          const rate = {
            key: 'rate',
            label: 'Retried runs',
            num: true,
            render: (t) => measure(t.rate, maxRate, numberFormat.format(t.retried) + ' <span class="count-of">(' + percent(t.rate) + ')</span>')
          };
          const failures = { key: 'failures', label: 'Failed runs', num: true, render: (t) => '<span class="' + (t.failures ? 'is-failed' : '') + '">' + numberFormat.format(t.failures) + '</span>' };
          const avg = {
            key: 'avg',
            label: 'Avg duration',
            num: true,
            render: (t) => (t.durationCount ? formatDuration(t.avg) : '<span class="secondary" title="No passed attempt with timing data in this period">–</span>')
          };
          const setup = { key: 'setup', label: 'Setup', num: true, render: (t) => (t.durationCount ? formatDuration(t.setup) : '') };
          const max = { key: 'max', label: 'Longest', num: true, render: (t) => (t.durationCount ? formatDuration(t.max) : '') };
          const runs = { key: 'runs', label: 'Runs', num: true, render: (t) => numberFormat.format(t.runs) };
          // The key metric of each tab is shown larger.
          if (state.tab === 'flaky') return [test, { ...retries, primary: true }, rate, failures, avg];
          if (state.tab === 'slowest') return [test, { ...avg, primary: true }, setup, max, runs];
          return [test, runs, retries, rate, failures, avg, setup, max];
        }

        function runColumns() {
          const conclusionLabel = (c) => (c ? c.charAt(0).toUpperCase() + c.slice(1).replace(/_/g, ' ') : 'In progress');
          return [
            { key: 'date', label: 'Date', help: RUNS_HELP.date, sortValue: runTime, render: (run) => formatDate(run.date) },
            { key: 'workflow', label: 'Workflow', help: RUNS_HELP.workflow, sortValue: (run) => String(run.workflow || ''), render: (run) => esc(run.workflow) },
            {
              key: 'run',
              label: 'Run',
              help: RUNS_HELP.run,
              sortValue: (run) => String(run.title || run.id),
              render: (run) => '<a href="' + esc(run.url) + '" target="_blank" rel="noopener">' + esc(run.title || run.id) + '</a>'
            },
            {
              key: 'result',
              label: 'Result',
              help: RUNS_HELP.result,
              sortValue: (run) => CONCLUSION_ORDER.indexOf(run.conclusion ?? null),
              render: (run) => '<span class="' + (isFailedRun(run) ? 'is-failed' : '') + '">' + esc(conclusionLabel(run.conclusion)) + '</span>'
            }
          ];
        }

        function headerRow(columns, sort, lead = '#') {
          const leadCell = lead === null ? '' : '<th class="num" scope="col"><span class="secondary">' + esc(lead) + '</span></th>';
          return '<tr>' + leadCell + columns
            .map((c) => {
              const sorted = sort.key === c.key ? ' aria-sort="' + (sort.dir === 'asc' ? 'ascending' : 'descending') + '"' : '';
              return '<th scope="col" data-sort="' + c.key + '"' + sorted + (c.num ? ' class="num"' : '') + ' title="' + esc(c.help || COLUMN_HELP[c.key]) + '">' + esc(c.label) + '</th>';
            })
            .join('') + '</tr>';
        }

        function runSummary(test) {
          const runs = plural(test.runs, 'run');
          let text = test.retried
            ? 'Needed a retry in ' + numberFormat.format(test.retried) + ' of ' + runs + (test.failures ? ', ' + numberFormat.format(test.failures) + ' of which still failed' : '') + '.'
            : 'Passed on the first attempt in all ' + runs + '.';
          const durations = test.runResults.map((r) => r.duration).filter((d) => d != null);
          if (durations.length) {
            text += ' Passed runs took ' + formatDuration(Math.min(...durations)) + ' to ' + formatDuration(Math.max(...durations)) + ', ' + formatDuration(test.avg) + ' on average.';
          }
          return text;
        }

        // Links to the suite's job when it is known (runs collected before job ids were stored only have the run URL).
        function runLink(result, test) {
          const run = result.run || {};
          const name = WORKFLOW_NAMES[run.workflow] || run.workflow || 'Workflow run';
          const jobId = run.jobs?.[test.suite];
          const url = run.url && jobId ? run.url + '/job/' + jobId : run.url;
          const link = url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(name) + '</a>' : esc(name);
          return link + (result.suiteAttempt > 1 ? ' <span class="secondary">(suite re-run ' + result.suiteAttempt + ')</span>' : '');
        }

        function attemptList(result) {
          if (!result.attempts) return '';
          return result.attempts
            .map(([status, duration]) => '<span class="' + (status === 'p' ? '' : 'attempt-failed') + '">' + (ATTEMPT_LABELS[status] || status) + (duration == null ? '' : ' ' + formatDuration(duration)) + '</span>')
            .join(', ');
        }

        function versusAverage(result, test) {
          if (result.duration == null || !test.durationCount) return '';
          const diff = result.duration - test.avg;
          const text = (diff >= 0 ? '+' : '−') + formatDuration(Math.abs(diff));
          return diff > test.avg * SLOW_RUN_RATIO ? '<span class="slower">' + text + '</span>' : '<span class="secondary">' + text + '</span>';
        }

        function detailRow(test, colspan) {
          const results = test.runResults
            .slice()
            .sort((a, b) => String(b.run?.createdAt || b.date).localeCompare(String(a.run?.createdAt || a.date)) || b.suiteAttempt - a.suiteAttempt);
          const showAllRuns = allRunsShown.has(test.index);
          const visible = showAllRuns ? results : results.slice(0, RUN_LIMIT);
          const rows = visible
            .map((r) => {
              const [label, cls] = OUTCOME_LABELS[r.outcome] || [r.outcome, ''];
              return '<tr><td>' + formatDate(r.date) + '</td><td>' + runLink(r, test) + '</td><td><span class="' + cls + '">' + label + '</span></td>' +
                '<td class="num">' + (r.retries || '<span class="secondary">0</span>') + '</td><td class="attempts">' + attemptList(r) + '</td>' +
                '<td class="num">' + (r.duration == null ? '<span class="secondary">–</span>' : formatDuration(r.duration)) + '</td>' +
                '<td class="num">' + (r.setup == null ? '' : formatDuration(r.setup)) + '</td><td class="num">' + versusAverage(r, test) + '</td></tr>';
            })
            .join('');
          let html = '<tr class="detail"><td></td><td colspan="' + colspan + '"><h2>Runs</h2><p class="detail-summary">' + esc(runSummary(test)) + '</p>';
          if (results.length) {
            html += '<table><thead><tr><th>Date</th><th>Run</th><th>Result</th><th class="num">Retries</th><th>Attempts</th>' +
              '<th class="num" title="Passed attempt, including setup">Duration</th><th class="num">Setup</th>' +
              '<th class="num" title="Difference from the average duration in the selected period. Runs more than 20% slower are highlighted.">vs average</th></tr></thead><tbody>' + rows + '</tbody></table>';
          }
          if (results.length > RUN_LIMIT) {
            html += '<div class="more"><button type="button" data-runs-toggle="' + test.index + '">' + (showAllRuns ? 'Show the latest ' + RUN_LIMIT + ' runs only' : 'Show all ' + results.length + ' runs') + '</button></div>';
          }
          if (test.daysWithoutDetail) {
            html += '<p class="detail-note">Run details are kept for ' + (metrics.detailDays || 14) + ' days, so ' + plural(test.daysWithoutDetail, 'earlier day') + ' only count towards the totals.</p>';
          }
          return html + '</td></tr>';
        }

        function legend(entries) {
          return '<details class="legend" id="legend"' + (legendOpen ? ' open' : '') + '><summary>What the columns mean</summary><p>' + esc(TAB_INTRO[state.tab]) + '</p><dl>' +
            entries.map(([term, text]) => '<dt>' + esc(term) + '</dt><dd>' + esc(text) + '</dd>').join('') +
            '</dl></details>';
        }

        function rowToggle(total, limit, noun) {
          if (total <= limit) return '';
          const label = showAll ? 'Show the top ' + limit + ' only' : 'Show all ' + numberFormat.format(total) + ' ' + noun;
          return '<div class="more"><button type="button" id="toggle-rows" aria-expanded="' + showAll + '">' + label + '</button></div>';
        }

        function renderTests(rows) {
          const columns = testColumns(rows);
          const sort = sortRows(rows, columns);
          const help = legend(columns.map((c) => [c.label, COLUMN_HELP[c.key]]));
          if (!rows.length) {
            $('panel').innerHTML = '<p class="empty">No tests match these filters. Clear the search or choose a longer period.</p>' + help;
            return;
          }
          if (state.tab === 'all') {
            renderTree(rows, columns, sort, help);
            return;
          }
          const limit = TOP_LIMIT;
          const noun = state.tab === 'flaky' ? 'flaky tests' : 'tests by duration';
          const visible = showAll ? rows : rows.slice(0, limit);
          let html = '<div class="table-wrap"><table><thead>' + headerRow(columns, sort) + '</thead><tbody>';
          visible.forEach((test, i) => {
            html += testRow(test, columns, '<td class="num rank">' + (i + 1) + '</td>');
          });
          html += '</tbody></table></div>' + rowToggle(rows.length, limit, noun) + help;
          $('panel').innerHTML = html;
        }

        function cellClass(column) {
          return [column.num ? 'num' : '', column.cls || '', column.primary ? 'primary' : ''].join(' ').trim();
        }

        function testRow(test, columns, leadCell, renderTitle) {
          const open = expanded.has(test.index);
          const cells = columns
            .map((c) => '<td class="' + cellClass(c) + '">' + (c.key === 'title' && renderTitle ? renderTitle(test) : c.render(test)) + '</td>')
            .join('');
          const html = '<tr class="test-row" tabindex="0" aria-expanded="' + open + '" data-index="' + test.index + '">' + leadCell + cells + '</tr>';
          return open ? html + detailRow(test, columns.length) : html;
        }

        function titleParts(test) {
          const parts = test.title.split(TITLE_SEPARATOR);
          return { describes: parts.slice(0, -1), name: parts[parts.length - 1] };
        }

        /** Suite › file › describe block(s) tree of the tests; every group carries the totals of its tests. */
        function buildTree(tests) {
          const newGroup = (kind, name, key, level) => ({ kind, name, key, level, groups: new Map(), tests: [] });
          const root = newGroup('root', '', '', -1);
          for (const test of tests) {
            const path = [['suite', test.suite], ['file', test.file], ...titleParts(test).describes.map((name) => ['describe', name])];
            let node = root;
            path.forEach(([kind, name], level) => {
              if (!node.groups.has(name)) {
                node.groups.set(name, newGroup(kind, name, JSON.stringify(path.slice(0, level + 1).map(([, n]) => n)), level));
              }
              node = node.groups.get(name);
            });
            node.tests.push(test);
          }
          summarizeGroup(root);
          return root;
        }

        function summarizeGroup(group) {
          const totals = { testCount: 0, runs: 0, retries: 0, retried: 0, failures: 0, durationSum: 0, durationCount: 0, setupSum: 0, max: 0 };
          const add = (item, testCount) => {
            totals.testCount += testCount;
            for (const key of ['runs', 'retries', 'retried', 'failures', 'durationSum', 'durationCount', 'setupSum']) totals[key] += item[key];
            totals.max = Math.max(totals.max, item.max);
          };
          for (const child of group.groups.values()) add(summarizeGroup(child), child.testCount);
          for (const test of group.tests) add(test, 1);
          Object.assign(group, totals, {
            avg: totals.durationCount ? totals.durationSum / totals.durationCount : 0,
            setup: totals.durationCount ? totals.setupSum / totals.durationCount : 0,
            rate: totals.runs ? totals.retried / totals.runs : 0
          });
          return group;
        }

        function isGroupOpen(group, siblingCount) {
          if (groupToggles.has(group.key)) return groupToggles.get(group.key);
          // Searching opens every group so the matches are visible; a lone group (e.g. one suite selected) opens too.
          return Boolean(state.q.trim()) || siblingCount === 1;
        }

        function treeRows(group, columns, sort) {
          const displayName = (item) => (item.kind ? item.name : titleParts(item).name);
          const value = (item) => (sort.key === 'title' ? displayName(item) : item[sort.key]);
          const sign = sort.dir === 'asc' ? 1 : -1;
          const children = [...group.groups.values(), ...group.tests].sort((a, b) => {
            const va = value(a), vb = value(b);
            const cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
            return cmp * sign || Boolean(b.kind) - Boolean(a.kind) || displayName(a).localeCompare(displayName(b));
          });
          const level = group.level + 1;
          const indent = 'padding-left:' + level * GROUP_INDENT_PX + 'px';
          return children
            .map((child) => {
              if (!child.kind) {
                const title = (t) => '<div style="' + indent + '"><div class="test-title">' + esc(titleParts(t).name) + '</div><div class="test-meta">' + sourceLink(t) + '</div></div>';
                return testRow(child, columns, '<td></td>', title);
              }
              const open = isGroupOpen(child, group.groups.size);
              visibleGroupKeys.push(child.key);
              const name = '<div class="group-name" style="' + indent + '"><span class="chevron" aria-hidden="true">' + (open ? '▾' : '▸') + '</span> ' +
                '<span class="group-kind">' + GROUP_KINDS[child.kind] + '</span> ' + esc(child.name) + ' <span class="count-of">' + plural(child.testCount, 'test') + '</span></div>';
              const cells = columns.map((c) => '<td class="' + cellClass(c) + '">' + (c.key === 'title' ? name : c.render(child)) + '</td>').join('');
              const row = '<tr class="group-row group-' + child.kind + '" tabindex="0" aria-expanded="' + open + '" data-group="' + esc(child.key) + '"><td></td>' + cells + '</tr>';
              return open ? row + treeRows(child, columns, sort) : row;
            })
            .join('');
        }

        function renderTree(rows, columns, sort, help) {
          visibleGroupKeys = [];
          const body = treeRows(buildTree(rows), columns, sort);
          const tools = '<div class="tree-tools"><button type="button" class="link-button" data-groups="open">Expand all</button>' +
            '<button type="button" class="link-button" data-groups="close">Collapse all</button></div>';
          $('panel').innerHTML = tools + '<div class="table-wrap"><table><thead>' + headerRow(columns, sort, '') + '</thead><tbody>' + body + '</tbody></table></div>' + help;
        }

        function expandAllGroups(open) {
          // Expanding reveals nested groups, so repeat until no new group shows up.
          let count;
          do {
            count = visibleGroupKeys.length;
            visibleGroupKeys.forEach((key) => groupToggles.set(key, open));
            render();
          } while (open && visibleGroupKeys.length > count);
        }

        function renderRuns(runs) {
          const columns = runColumns();
          const help = legend(columns.map((c) => [c.label, c.help]));
          if (!runs.length) {
            const empty = state.tab === 'failed' ? 'No failed workflow runs in this period.' : 'No workflow runs match these filters. Clear the search or choose a longer period.';
            $('panel').innerHTML = '<p class="empty">' + empty + '</p>' + help;
            return;
          }
          const sort = sortRows(runs, columns, runTieBreak);
          $('panel').innerHTML = '<div class="table-wrap"><table><thead>' + headerRow(columns, sort, null) + '</thead><tbody>' +
            runs.map((run) => '<tr>' + columns.map((c) => '<td>' + c.render(run) + '</td>').join('') + '</tr>').join('') +
            '</tbody></table></div>' + help;
        }

        function render() {
          const dates = rangeDates();
          const data = aggregate(dates);
          const suites = [...new Set(metrics.tests.map(([suite]) => suite))].sort();
          const filtered = data.tests.filter(matchesFilters);
          const q = state.q.trim().toLowerCase();
          const runs = data.days
            .flatMap((day) => day.runs.map((run) => ({ ...run, date: day.date })))
            .filter((run) => !q || (run.title + ' ' + run.workflow).toLowerCase().includes(q));
          const failedRuns = runs.filter(isFailedRun);
          renderMasthead();
          renderFilters(suites);
          renderSummary(data, dates);
          renderTabs({ flaky: filtered.filter(tabFilter('flaky')).length, all: filtered.length, runs: runs.length, failed: failedRuns.length });
          if (state.tab === 'runs') renderRuns(runs);
          else if (state.tab === 'failed') renderRuns(failedRuns);
          else renderTests(filtered.filter(tabFilter(state.tab)));
        }

        // Calendar for the "Up to" date: weeks start on Monday, days without data are marked.
        function addMonths(month, count) {
          const [year, monthIndex] = month.split('-').map(Number);
          return new Date(Date.UTC(year, monthIndex - 1 + count, 1)).toISOString().slice(0, 7);
        }

        function renderCalendar() {
          const selected = state.end || lastDate;
          const [year, monthIndex] = calendarMonth.split('-').map(Number);
          const daysInMonth = new Date(Date.UTC(year, monthIndex, 0)).getUTCDate();
          const offset = (new Date(Date.UTC(year, monthIndex - 1, 1)).getUTCDay() + 6) % 7;
          const title = new Date(Date.UTC(year, monthIndex - 1, 1)).toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' });
          let cells = WEEKDAYS.map((day) => '<span class="weekday" aria-hidden="true">' + day + '</span>').join('') + '<span></span>'.repeat(offset);
          for (let day = 1; day <= daysInMonth; day++) {
            const date = calendarMonth + '-' + String(day).padStart(2, '0');
            const disabled = date > lastDate || date < firstDate;
            const hasData = datesWithData.has(date);
            const label = formatDate(date, { weekday: 'long', year: 'numeric' }) + (hasData ? '' : ', no data');
            cells += '<button type="button" class="day' + (hasData ? ' has-data' : '') + '" data-date="' + date + '" aria-label="' + esc(label) + '" aria-pressed="' + (date === selected) + '" tabindex="' + (date === selected ? 0 : -1) + '"' + (disabled ? ' disabled' : '') + '>' + day + '</button>';
          }
          $('calendar').innerHTML =
            '<div class="calendar-head">' +
            '<button type="button" data-month="-1" aria-label="Previous month"' + (calendarMonth <= firstDate.slice(0, 7) ? ' disabled' : '') + '>‹</button>' +
            '<strong>' + esc(title) + '</strong>' +
            '<button type="button" data-month="1" aria-label="Next month"' + (calendarMonth >= lastDate.slice(0, 7) ? ' disabled' : '') + '>›</button>' +
            '</div><div class="calendar-grid" role="group" aria-label="' + esc(title) + '">' + cells + '</div>' +
            '<div class="calendar-foot"><span>Dot: day with data</span><button type="button" class="link-button" data-date="' + lastDate + '">Latest day</button></div>';
        }

        function focusDay(date) {
          const button = $('calendar').querySelector('.day[data-date="' + date + '"]');
          if (button) {
            $('calendar').querySelectorAll('.day').forEach((day) => (day.tabIndex = -1));
            button.tabIndex = 0;
            button.focus();
          }
        }

        function openCalendar() {
          calendarMonth = (state.end || lastDate).slice(0, 7);
          renderCalendar();
          $('calendar').hidden = false;
          $('end').setAttribute('aria-expanded', 'true');
          focusDay(state.end || lastDate);
        }

        function closeCalendar(returnFocus) {
          if ($('calendar').hidden) return;
          $('calendar').hidden = true;
          $('end').setAttribute('aria-expanded', 'false');
          if (returnFocus) $('end').focus();
        }

        $('end').addEventListener('click', () => ($('calendar').hidden ? openCalendar() : closeCalendar(false)));
        $('calendar').addEventListener('click', (e) => {
          const monthButton = e.target.closest('[data-month]');
          if (monthButton) {
            calendarMonth = addMonths(calendarMonth, Number(monthButton.dataset.month));
            renderCalendar();
            $('calendar').querySelector('[data-month="' + monthButton.dataset.month + '"]')?.focus();
            return;
          }
          const dayButton = e.target.closest('[data-date]');
          if (dayButton && !dayButton.disabled) {
            closeCalendar(true);
            setState({ end: dayButton.dataset.date === lastDate ? '' : dayButton.dataset.date });
          }
        });
        $('calendar').addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            closeCalendar(true);
            return;
          }
          const day = e.target.closest('.day');
          const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
          if (!day || !step) return;
          e.preventDefault();
          let next = shiftDate(day.dataset.date, step);
          next = next > lastDate ? lastDate : next < firstDate ? firstDate : next;
          if (next.slice(0, 7) !== calendarMonth) {
            calendarMonth = next.slice(0, 7);
            renderCalendar();
          }
          focusDay(next);
        });
        document.addEventListener('mousedown', (e) => {
          if (!$('date-field').contains(e.target)) closeCalendar(false);
        });

        $('days').addEventListener('change', (e) => setState({ days: e.target.value }));
        $('q').addEventListener('input', (e) => setState({ q: e.target.value }));
        $('suite').addEventListener('change', (e) => setState({ suite: e.target.value }));
        $('reset').addEventListener('click', () => setState({ ...DEFAULTS, tab: state.tab }));
        $('tabs').addEventListener('click', (e) => {
          const tab = e.target.closest('button')?.dataset.tab;
          if (tab) setState({ tab, sort: '', dir: '' });
        });
        $('summary').addEventListener('click', (e) => {
          const tab = e.target.closest('button[data-tab]')?.dataset.tab;
          if (!tab) return;
          setState({ tab, sort: '', dir: '' });
          const tabButton = $('tabs').querySelector('[data-tab="' + tab + '"]');
          tabButton?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          tabButton?.focus({ preventScroll: true });
        });

        function toggleRow(row) {
          const index = Number(row.dataset.index);
          expanded.has(index) ? expanded.delete(index) : expanded.add(index);
          render();
          document.querySelector('tr.test-row[data-index="' + index + '"]')?.focus();
        }

        function toggleGroup(row) {
          const key = row.dataset.group;
          groupToggles.set(key, row.getAttribute('aria-expanded') !== 'true');
          render();
          document.querySelector('tr.group-row[data-group="' + CSS.escape(key) + '"]')?.focus();
        }

        $('panel').addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          const groupsButton = e.target.closest('[data-groups]');
          if (groupsButton) {
            expandAllGroups(groupsButton.dataset.groups === 'open');
            $('panel').querySelector('[data-groups="' + groupsButton.dataset.groups + '"]')?.focus();
            return;
          }
          const runsToggle = e.target.closest('[data-runs-toggle]');
          if (runsToggle) {
            const index = Number(runsToggle.dataset.runsToggle);
            allRunsShown.has(index) ? allRunsShown.delete(index) : allRunsShown.add(index);
            render();
            document.querySelector('[data-runs-toggle="' + index + '"]')?.focus();
            return;
          }
          if (e.target.id === 'toggle-rows') {
            showAll = !showAll;
            render();
            $('toggle-rows')?.focus();
            return;
          }
          const header = e.target.closest('th[data-sort]');
          if (header) {
            const current = header.getAttribute('aria-sort');
            setState({ sort: header.dataset.sort, dir: current === 'descending' ? 'asc' : 'desc' });
            return;
          }
          const row = e.target.closest('tr.test-row');
          if (row) toggleRow(row);
          const groupRow = e.target.closest('tr.group-row');
          if (groupRow) toggleGroup(groupRow);
        });
        $('panel').addEventListener('toggle', (e) => {
          if (e.target.id === 'legend') legendOpen = e.target.open;
        }, true);
        $('panel').addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          const row = e.target.closest('tr.test-row, tr.group-row');
          if (!row || e.target.closest('a, button')) return;
          e.preventDefault();
          row.classList.contains('group-row') ? toggleGroup(row) : toggleRow(row);
        });
        window.addEventListener('hashchange', () => {
          state = readState();
          render();
        });
        render();
      })();
    </script>
  </body>
</html>
