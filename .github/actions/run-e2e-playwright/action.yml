name: "Run e2e Playwright"
description: "Run e2e Playwright"

inputs:
  options:
    description: 'Options'
    required: true
  test-runner:
    description: 'Test runner'
    required: false
    default: 'Playwright'
  artifact-name:
    description: Name of the artifact cache
    required: true
  suite-attempts:
    description: 'Maximum number of times to run the whole test suite (1 = no retry)'
    required: false
    default: '1'
  metrics-dir:
    description: 'If set, an e2e-metrics report of each suite attempt (attempt-<n>.json) and the excluded tests of the suite (excluded.json) are written to this directory for the daily E2E metrics dashboard'
    required: false
    default: ''

runs:
  using: "composite"
  steps:

    - name: Set PLAYWRIGHT_E2E_HOST
      if: inputs.url != ''
      shell: bash
      run: |
        # Construct the full URL with /aca path (without #/ as tests add that)
        if [[ "${{ inputs.url }}" != *"/aca"* ]]; then
          echo "PLAYWRIGHT_E2E_HOST=${{ inputs.url }}/aca" >> $GITHUB_ENV
        else
          echo "PLAYWRIGHT_E2E_HOST=${{ inputs.url }}" >> $GITHUB_ENV
        fi

    - name: Setup and run with options
      shell: bash
      env:
        OPTIONS: ${{ inputs.options }}
        PLAYWRIGHT_BROWSER: ${{ env.PLAYWRIGHT_BROWSER || 'chromium' }}
        SUITE_ATTEMPTS: ${{ inputs.suite-attempts }}
        METRICS_DIR: ${{ inputs.metrics-dir }}
      run: |
        if [ -n "${METRICS_DIR}" ]; then
          mkdir -p -- "${METRICS_DIR}"
          METRICS_DIR=$(cd -- "${METRICS_DIR}" && pwd)
        fi

        # Only start local server if using localhost
        if [[ "${PLAYWRIGHT_E2E_HOST}" == "http://localhost"* ]]; then
          pnpm start > /dev/null &
        fi

        printf "Waiting for the application to be ready..."
        while ! curl -sf ${PLAYWRIGHT_E2E_HOST} > /dev/null; do
          printf "."
          sleep 1
        done
        printf "\nApplication is ready.\n"

        for attempt in $(seq 1 "${SUITE_ATTEMPTS:-1}"); do
          echo "Running playwright tests with options $OPTIONS on browser ${PLAYWRIGHT_BROWSER} (suite attempt $attempt/${SUITE_ATTEMPTS:-1})"
          if [ -n "${METRICS_DIR}" ]; then export E2E_METRICS_FILE="${METRICS_DIR}/attempt-${attempt}.json"; fi
          if E2E_TARGET=$OPTIONS pnpm ci:e2e; then
            exit 0
          fi
          if [ "$attempt" -lt "${SUITE_ATTEMPTS:-1}" ]; then
            echo "Suite failed, retrying the whole suite..."
          fi
        done
        echo "Suite failed after ${SUITE_ATTEMPTS:-1} attempt(s)."
        exit 1

    - name: List excluded tests
      if: ${{ !cancelled() && inputs.metrics-dir != '' }}
      shell: bash
      env:
        OPTIONS: ${{ inputs.options }}
        METRICS_DIR: ${{ inputs.metrics-dir }}
        PLAYWRIGHT_BROWSER: ${{ env.PLAYWRIGHT_BROWSER || 'chromium' }}
      run: |
        config="e2e/playwright/${OPTIONS}/playwright.config.ts"
        if [ ! -f "$config" ]; then
          echo "::warning::Could not find ${config}, so the excluded tests of ${OPTIONS} are not listed."
          exit 0
        fi
        mkdir -p -- "${METRICS_DIR}"
        export E2E_EXCLUDED_TESTS_FILE="$(cd -- "${METRICS_DIR}" && pwd)/excluded.json"
        if ! ./node_modules/.bin/playwright test --config="$config" --list > /dev/null; then
          echo "::warning::Could not list the excluded tests of ${OPTIONS}."
        fi
