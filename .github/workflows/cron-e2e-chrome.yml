name: "Cron chrome E2E run"
run-name: ${{ github.event_name == 'workflow_dispatch' && 'Manual chrome E2E run' || 'Cron chrome E2E run' }}

# Daily chrome run. Its per-test metrics are counted by the E2E metrics report (see e2e-metrics-report.yml).

on:
  schedule:
    - cron: '0 6 * * *' #At 06:00 every day.
  workflow_dispatch:

jobs:
  chrome:
    name: "Cron browser E2E run - chrome"
    uses: ./.github/workflows/e2e-playwright-reusable.yml
    with:
      browser: chrome
      collect-metrics: true
    secrets:
      REPORT_PORTAL_TOKEN: ${{ secrets.REPORT_PORTAL_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
