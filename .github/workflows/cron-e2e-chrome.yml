name: "E2E dashboard - Daily chrome E2E run"
run-name: ${{ github.event_name == 'workflow_dispatch' && 'E2E dashboard - Manual chrome E2E run' || 'E2E dashboard - Daily chrome E2E run' }}

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  chrome:
    name: "Cron browser E2E run - chrome"
    uses: ./.github/workflows/e2e-playwright-reusable.yml
    with:
      browser: chrome
      collect-metrics: true
    secrets:
      REPORT_PORTAL_TOKEN: ${{ secrets.REPORT_PORTAL_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
