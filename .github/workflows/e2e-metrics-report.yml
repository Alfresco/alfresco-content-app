name: "E2E dashboard - Daily collection"
run-name: ${{ github.event_name == 'workflow_dispatch' && 'E2E dashboard - Manual collection' || 'E2E dashboard - Daily collection' }}

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC day to collect (YYYY-MM-DD). Defaults to today; runs still in progress are not collected.'
        required: false
        default: ''
      post-report:
        description: 'Post the weekly summary (7 days ending on the collected day) to Teams'
        required: false
        type: boolean
        default: false

concurrency:
  group: e2e-metrics-report
  cancel-in-progress: false

jobs:
  collect:
    name: "Collect daily E2E metrics"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      date: ${{ steps.params.outputs.date }}
      post-report: ${{ steps.params.outputs.post-report }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Resolve parameters
        id: params
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_POST_REPORT: ${{ inputs.post-report }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            date="$INPUT_DATE"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            date="$(date -u +%F)"
          else
            date="$(date -u -d yesterday +%F)"
          fi
          if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid date '$date', expected YYYY-MM-DD."
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            post_report="${INPUT_POST_REPORT:-false}"
          elif [ "$(date -u +%u)" = "1" ]; then
            post_report=true
          else
            post_report=false
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "post-report=$post_report" >> "$GITHUB_OUTPUT"
          echo "Collecting E2E metrics for $date (post weekly report: $post_report)"

      - name: Collect metrics from E2E runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_DATE: ${{ steps.params.outputs.date }}
          OUTPUT_FILE: e2e-metrics-daily/${{ steps.params.outputs.date }}.json
        run: node .github/scripts/e2e-metrics/collect-daily.js

      - name: Upload daily metrics
        uses: actions/upload-artifact@v7
        with:
          name: e2e-metrics-daily-${{ steps.params.outputs.date }}
          path: e2e-metrics-daily/${{ steps.params.outputs.date }}.json
          retention-days: 28
          overwrite: true

  publish:
    name: "Publish dashboard and report"
    needs: collect
    if: ${{ !cancelled() && needs.collect.result == 'success' }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/e2e-metrics-publish.yml
    with:
      end-date: ${{ needs.collect.outputs.date }}
      deploy-dashboard: ${{ github.ref_name == 'develop' }}
      send-report: false
      report-days: 7

  report:
    name: "Send weekly report to Teams"
    needs: [collect, publish]
    if: ${{ always() && needs.collect.result == 'success' && needs.collect.outputs.post-report == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Download daily metrics
        uses: actions/download-artifact@v8
        with:
          name: e2e-metrics-daily-${{ needs.collect.outputs.date }}
          path: e2e-metrics-daily

      - name: Build report
        env:
          REPORT_END_DATE: ${{ needs.collect.outputs.date }}
          REPORT_DAYS: 7
          DAILY_DIR: e2e-metrics-daily
          DASHBOARD_PUBLISHED: ${{ needs.publish.result == 'success' && github.ref_name == 'develop' }}
          DASHBOARD_URL: ${{ needs.publish.outputs.dashboard-url }}
          OUTPUT_DIR: e2e-metrics-weekly
        run: node .github/scripts/e2e-metrics/weekly-report.js

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: e2e-metrics-weekly-${{ needs.collect.outputs.date }}
          path: e2e-metrics-weekly
          retention-days: 14
          overwrite: true

      - name: Post to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_E2E_WEBHOOK_URL }}
          CARD_FILE: e2e-metrics-weekly/teams-card.json
        run: node .github/scripts/e2e-metrics/post-teams.js
