name: "Populate E2E reports"
run-name: ${{ inputs.send-report && 'Populate E2E reports + send report to Teams' || 'Populate E2E reports' }}

# Runs the E2E suites (chrome) against a locally deployed ACS, the same way as the daily chrome cron run and pull
# requests, and uploads per-test metrics counted by the E2E metrics report (see e2e-metrics-report.yml).
# Only runs on develop are counted.
# Optionally sends a report covering the last `report-days` days (including today's runs) to Teams.

on:
  workflow_dispatch:
    inputs:
      send-report:
        description: 'Send a report to the Teams channel after the tests finish'
        required: false
        type: boolean
        default: false
      report-days:
        description: 'Number of days covered by the report (ending today)'
        required: false
        type: number
        default: 14

permissions:
  actions: read
  contents: read

jobs:
  check-branch:
    name: "Check branch"
    runs-on: ubuntu-latest
    steps:
      - name: Warn when not on develop
        if: ${{ github.ref_name != 'develop' }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "::warning::This run is on '${REF_NAME}', only develop runs are counted in the E2E metrics report."

  e2e:
    name: "E2E against local ACS - chrome"
    needs: check-branch
    uses: ./.github/workflows/e2e-playwright-reusable.yml
    with:
      browser: chrome
      collect-metrics: true
    secrets:
      REPORT_PORTAL_TOKEN: ${{ secrets.REPORT_PORTAL_TOKEN }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}

  report:
    name: "Send E2E report to Teams"
    needs: e2e
    if: ${{ !cancelled() && inputs.send-report }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Resolve date
        id: params
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # The nightly collection only covers previous days, so today's runs (including this one) are collected here.
      - name: Collect today's metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_DATE: ${{ steps.params.outputs.today }}
          INCLUDE_RUN_ID: ${{ github.run_id }}
          OUTPUT_FILE: e2e-metrics-daily/${{ steps.params.outputs.today }}.json
        run: node .github/scripts/e2e-metrics/collect-daily.js

      - name: Build report and notify Teams
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_END_DATE: ${{ steps.params.outputs.today }}
          REPORT_DAYS: ${{ inputs.report-days }}
          DAILY_DIR: e2e-metrics-daily
          OUTPUT_DIR: e2e-metrics-report
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_E2E_WEBHOOK_URL }}
        run: node .github/scripts/e2e-metrics/weekly-report.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ steps.params.outputs.today }}
          path: e2e-metrics-report
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
