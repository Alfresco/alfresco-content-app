"project_id": "13"
"api_token_env": "CROWDIN_TOKEN"
"base_path": "."
"base_url": "https://hyland.api.crowdin.com"
"preserve_hierarchy": true
"files": [
  {
    "source": "/**/**/i18n/en.json",
    "translation": "/%original_path%/%two_letters_code%.%file_extension%",
    "export_only_approved": "true",
    "update_option": "update_without_changes",
    # Regional English variants share the "en" two_letters_code with the en.json
    # source. Map them to their full locale so they export to their own files
    # (e.g. en-AU.json) instead of overwriting the English source-of-truth.
    "languages_mapping": {
      "two_letters_code": {
        "en-AU": "en-AU"
      }
    }
  }
]
