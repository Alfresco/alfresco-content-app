# Block packages published less than 3 days ago (4320 minutes)
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - '@alfresco/*'

overrides:
  # Security fixes
  '@module-federation/sdk>node-fetch': '^2.7.0'
  # GHSA-g3hv-75wg-m249: minimatch 11 removed makeRe(), so only parents that don't use it are moved to 11.
  # nx still calls minimatch.makeRe() and stays on 10.2.x until https://github.com/nrwl/nx/issues/37727 is fixed.
  '@nx/devkit>minimatch@<11.0.1': '11.0.5'
  '@typescript-eslint/typescript-estree>minimatch@<11.0.1': '11.0.5'
  '@tufjs/models>minimatch@<11.0.1': '11.0.5'
  'ignore-walk>minimatch@<11.0.1': '11.0.5'
  # glob 10-13 can't use minimatch 11; glob 14 keeps the glob()/globSync()/sync() API their parents call here.
  'glob@>=10.0.0 <14.0.0': '14.0.4'

allowBuilds:
  '@esbuild/darwin-arm64': true
  '@esbuild/darwin-x64': true
  '@esbuild/linux-x64': true
  '@esbuild/win32-x64': true
  '@nx/nx-darwin-arm64': true
  '@nx/nx-darwin-x64': true
  '@nx/nx-linux-x64-gnu': true
  '@nx/nx-linux-x64-musl': true
  '@nx/nx-win32-x64-msvc': true
  '@parcel/watcher': true
  esbuild: true
  fsevents: true
  husky: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  pdfjs-dist: true
  playwright: true
  sass: true
